name: Java CI Pipeline con Sonar y Dependency-Track

run-name: Build ${{ github.run_number }} - lanzado por ${{ github.actor }} - en ${{ github.ref_name }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-analyze:
    name: 🚀 Compilar, Testear y Analizar Calidad de Código
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Es crucial para que SonarQube analice el historial de Git correctamente

    # 2. Configurar el entorno de Java 21
    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # Almacena las dependencias en caché para acelerar futuras ejecuciones

    # 3. Compilar y ejecutar Tests Unitarios / Integración
    # Si algún test falla, el comando devuelve un error y detiene el flujo de inmediato.
    - name: Compilar y Validar Tests
      run: mvn clean verify

    # 4. Análisis de Calidad del Código con Sonar Cloud / SonarQube
    # Requiere que configures SONAR_TOKEN y SONAR_HOST_URL (si usas On-Premise) en los Secrets de GitHub
    - name: Analizar Calidad de Código (Sonar)
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
      run: |
        mvn -B sonar:sonar \
        -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
        -Dsonar.projectName=${{ github.event.repository.name }} \
        -Dsonar.organization=${{ github.repository_owner }} \
        -Dsonar.branch.name=${{ github.ref_name }} \
        -Dsonar.host.url=https://sonarcloud.io

    # 5. Generar y Subir informe CycloneDX BOM a Dependency-Track
    # Este paso genera el archivo de dependencias (BOM) y lo envía a tu servidor de Dependency-Track
