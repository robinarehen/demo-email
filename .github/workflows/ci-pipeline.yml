name: Java CI Pipeline con Sonar y Dependency-Track

run-name: Build ${{ github.run_number }} - lanzado por ${{ github.actor }} - en ${{ github.ref_name }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-analyze:
    name: 🚀 Compilar, Testear y Analizar Calidad de Código
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Es crucial para que SonarQube analice el historial de Git correctamente

    # 2. Configurar el entorno de Java 21
    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # Almacena las dependencias en caché para acelerar futuras ejecuciones

    # 3. Compilar y ejecutar Tests Unitarios / Integración
    # Si algún test falla, el comando devuelve un error y detiene el flujo de inmediato.
    - name: Compilar y Validar Tests
      run: mvn clean verify

    - name: Crear proyecto en SonarCloud si no existe
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_ORGANIZATION }}_${{ github.event.repository.name }}
        SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
      run: |
        echo "Creando proyecto en SonarCloud (si no existe)..."
        curl -X POST "https://sonarcloud.io/api/projects/create" \
          -u "$SONAR_TOKEN:" \
          -d "organization=$SONAR_ORGANIZATION" \
          -d "project=$SONAR_PROJECT_KEY" \
          -d "name=$SONAR_PROJECT_NAME" || echo "El proyecto ya existe"

#    - name: Hacer el proyecto público en SonarCloud
#      env:
#        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#        SONAR_PROJECT_KEY: ${{ vars.SONAR_ORGANIZATION }}_${{ github.event.repository.name }}
#      run: |
#        echo "Actualizando visibilidad del proyecto a público..."
#        curl -X POST "https://sonarcloud.io/api/projects/update_visibility" \
#          -u "$SONAR_TOKEN:" \
#          -d "project=$SONAR_PROJECT_KEY" \
#          -d "visibility=public"

    # 4. Análisis de Calidad del Código con Sonar Cloud / SonarQube
    # Requiere que configures SONAR_TOKEN y SONAR_HOST_URL (si usas On-Premise) en los Secrets de GitHub
    - name: Analizar Calidad de Código (Sonar)
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_ORGANIZATION }}_${{ github.event.repository.name }}
#        SONAR_BRANCH: ${{ github.ref_name }}
      run: |
        mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.token=SONAR_TOKEN \
        -Dsonar.organization=$SONAR_ORGANIZATION \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
#        -Dsonar.scm.disabled=true \
#        -Dsonar.scm.revision=$SONAR_BRANCH

