#      env:
#        DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
#        DEPENDENCY_TRACK_URL: "https://tu-servidor-dependency-track.com"
#        PROJECT_UUID: "tu-uuid-de-proyecto-en-dependency-track"
#      run: |
#        # Genera el reporte usando el plugin de CycloneDX para Maven
#        mvn cyclonedx:makeAggregateBom
