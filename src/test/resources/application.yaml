spring:
  application:
    name: demo-email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_APP_EMAIL:crearVariableEntorno}
    password: ${GOOGLE_APP_EMAIL_PASSWORD:crearVariableEntorno}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Variables de entorno
gateway:
  secret: ${X-GATEWAY-SECRET:crearVariableEntorno}
